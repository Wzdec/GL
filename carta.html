<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia con Absorción de Texto - Three.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Añadimos Tween.js para animaciones suaves -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <script>
        /* =========================================================
           CONSTANTES GLOBALES
        ========================================================= */
        const FRASES = [
            "Eres una gran persona",
            "Me alegra haberte conocido",
            "Gracias por escucharme",
            "Reír contigo siempre lo cura todo.",
            "Cuenta conmigo :)",
            "Sonrie siempre",
            "Algun dia ya nos veremos xd"
        ];

        /* =========================================================
           ESCENA
        ========================================================= */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        // Niebla para ayudar a que los objetos desaparezcan en la distancia
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        /* =========================================================
           CÁMARA
        ========================================================= */
        const camera = new THREE.PerspectiveCamera(
            70,
            window.innerWidth / window.innerHeight,
            0.1,
            3000
        );
        camera.position.set(0, 80, 160);

        /* =========================================================
           RENDER
        ========================================================= */
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        // Importante para el efecto de brillo (Bloom) aunque no lo implementé fully, ayuda a la mezcla
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.5;
        document.body.appendChild(renderer.domElement);

        /* =========================================================
           CONTROLES
        ========================================================= */
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.enablePan = false;
        controls.minDistance = 20;
        controls.maxDistance = 500;
        // Ligeramente más rápido para apreciar la escena
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        /* =========================================================
           TEXTURA PROCEDURAL DE ESTRELLA
        ========================================================= */
        function crearTextura() {
            const canvas = document.createElement("canvas");
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext("2d");
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, "rgba(255,255,255,1)");
            gradient.addColorStop(0.2, "rgba(255,255,255,0.8)");
            gradient.addColorStop(0.5, "rgba(255,255,255,0.2)");
            gradient.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const estrellaTexture = crearTextura();

        /* =========================================================
           GRUPO DEL UNIVERSO
        ========================================================= */
        const universo = new THREE.Group();
        scene.add(universo);

        /* =========================================================
           FONDO DE ESTRELLAS
        ========================================================= */
        const backgroundGeometry = new THREE.BufferGeometry();
        const backgroundCount = 10000;
        const backgroundPositions = new Float32Array(backgroundCount * 3);
        for (let i = 0; i < backgroundCount; i++) {
            backgroundPositions[i * 3] = (Math.random() - .5) * 2000;
            backgroundPositions[i * 3 + 1] = (Math.random() - .5) * 2000;
            backgroundPositions[i * 3 + 2] = (Math.random() - .5) * 2000;
        }
        backgroundGeometry.setAttribute("position", new THREE.BufferAttribute(backgroundPositions, 3));
        const backgroundMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1.5,
            map: estrellaTexture,
            transparent: true,
            opacity: 0.6,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const backgroundStars = new THREE.Points(backgroundGeometry, backgroundMaterial);
        universo.add(backgroundStars);

        /* =========================================================
           SISTEMA CENTRAL (NÚCLEO Y AGUJERO NEGRO)
        ========================================================= */
        const coreGroup = new THREE.Group();
        universo.add(coreGroup);

        const blackHoleGeo = new THREE.SphereGeometry(6.0, 64, 64);
        const blackHoleMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const blackHole = new THREE.Mesh(blackHoleGeo, blackHoleMat);
        coreGroup.add(blackHole);

        // Disco de acreción
        const accretionGeo = new THREE.RingGeometry(6.5, 18, 128);
        const accretionMat = new THREE.ShaderMaterial({
            uniforms: {
                color1: { value: new THREE.Color(0xffdf33) }, // Amarillo intenso
                color2: { value: new THREE.Color(0xff3300) }  // Naranja rojizo
            },
            vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position,1.0);
        }
    `,
            fragmentShader: `
        uniform vec3 color1;
        uniform vec3 color2;
        varying vec2 vUv;
        void main() {
            gl_FragColor = vec4(mix(color1, color2, vUv.x), 0.95);
        }
    `,
            side: THREE.DoubleSide,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const accretionRing = new THREE.Mesh(accretionGeo, accretionMat);
        accretionRing.rotation.x = Math.PI / 2;
        coreGroup.add(accretionRing);

        // Brillo exterior
        const outerGlowGeo = new THREE.RingGeometry(17.0, 40, 128);
        const outerGlowMat = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
            depthTest: false
        });
        const outerGlow = new THREE.Mesh(outerGlowGeo, outerGlowMat);
        outerGlow.rotation.x = Math.PI / 2;
        coreGroup.add(outerGlow);

        /* =========================================================
           GALAXIA (Brazos espirales)
        ========================================================= */
        const galaxia = new THREE.Group();
        universo.add(galaxia);

        const galaxyCount = 60000;
        const galaxyGeometry = new THREE.BufferGeometry();
        const galaxyPositions = new Float32Array(galaxyCount * 3);
        const galaxyColors = new Float32Array(galaxyCount * 3);
        const brazos = 2;

        for (let i = 0; i < galaxyCount; i++) {
            const brazo = i % brazos;
            const radio = 25 + Math.pow(Math.random(), 1.2) * 100;
            const baseAngle = brazo * (Math.PI * 2 / brazos);
            const spiral = radio * 0.8;
            const dispersion = (Math.random() - 0.5) * (1.5 + radio * 0.1);
            const angle = baseAngle + spiral + dispersion;
            galaxyPositions[i * 3] = Math.cos(angle) * radio + (Math.random() - .5) * 2;
            galaxyPositions[i * 3 + 1] = (Math.random() - 0.5) * 8 * (1 - radio / 150);
            galaxyPositions[i * 3 + 2] = Math.sin(angle) * radio + (Math.random() - .5) * 2;
            const color = new THREE.Color();
            if (radio < 40) color.setRGB(1.0, 0.9, 0.6);
            else color.setHSL(0.6 + Math.random() * 0.1, 1.0, 0.7);
            galaxyColors[i * 3] = color.r;
            galaxyColors[i * 3 + 1] = color.g;
            galaxyColors[i * 3 + 2] = color.b;
        }
        galaxyGeometry.setAttribute("position", new THREE.BufferAttribute(galaxyPositions, 3));
        galaxyGeometry.setAttribute("color", new THREE.BufferAttribute(galaxyColors, 3));
        const galaxyMaterial = new THREE.PointsMaterial({
            size: 0.5,
            map: estrellaTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const galaxyStars = new THREE.Points(galaxyGeometry, galaxyMaterial);
        galaxia.add(galaxyStars);

        /* =========================================================
           PLANETAS ORBITANDO
        ========================================================= */
        const planetasGroup = new THREE.Group();
        galaxia.add(planetasGroup);
        const datosPlanetas = [
            { radio: 0.8, distancia: 45, color: 0x888888, velocidad: 0.012 },
            { radio: 1.2, distancia: 58, color: 0xe3bb76, velocidad: 0.010 },
            { radio: 1.3, distancia: 72, color: 0x2277ff, velocidad: 0.008 },
            { radio: 1.0, distancia: 88, color: 0xcc4400, velocidad: 0.006 },
            { radio: 3.0, distancia: 110, color: 0xd4a373, velocidad: 0.004, tieneAnillo: true },
        ];
        const meshesPlanetas = [];
        datosPlanetas.forEach((p, index) => {
            const pGroup = new THREE.Group();
            const geometry = new THREE.SphereGeometry(p.radio, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.7 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            pGroup.add(mesh);
            if (p.tieneAnillo) {
                const ringGeo = new THREE.RingGeometry(p.radio * 1.5, p.radio * 2.2, 64);
                const ringMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, side: THREE.DoubleSide, transparent: true, opacity: 0.8, roughness: 0.9 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                pGroup.add(ring);
            }
            const anguloInicial = (index / datosPlanetas.length) * Math.PI * 2;
            pGroup.userData = { distancia: p.distancia, angulo: anguloInicial, velocidad: p.velocidad, indiceFrase: index };
            planetasGroup.add(pGroup);
            meshesPlanetas.push(pGroup);
        });
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        galaxia.add(ambientLight);

        /* =========================================================
           SISTEMA DE TEXTO 3D (Absorción)
        ========================================================= */
        let fuenteCargada = null;
        const fontLoader = new THREE.FontLoader();
        // Usamos una fuente JSON estandar de Three.js (Gentilis)
        fontLoader.load('https://threejs.org/examples/fonts/gentilis_regular.typeface.json', (font) => {
            fuenteCargada = font;
        });

        const grupoTextos = new THREE.Group();
        scene.add(grupoTextos);

        function crearYAbsorberTexto(planetaMesh) {
            if (!fuenteCargada) return;

            const indice = planetaMesh.userData.indiceFrase;
            const frase = FRASES[indice];

            const textGeo = new THREE.TextGeometry(frase, {
                font: fuenteCargada,
                size: 2.5,
                height: 0.5,
                curveSegments: 12,
            });

            // Centrar geometría
            textGeo.computeBoundingBox();
            const centroX = - (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x) / 2;

            const textMat = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    time: { value: 0 }
                },
                vertexShader: `
            uniform float time;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec3 pos = position;
                
                // Efecto de deformación: si la letra está "lejos" (x positiva en local), se estira hacia el agujero negro
                // Esto es una aproximación simple, la magia la hace la animación de posición global.
                float stretch = max(0.0, (pos.x + centroX) * 0.1 * time);
                pos.x += stretch;

                gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(pos, 1.0);
            }
        `,
                fragmentShader: `
            uniform vec3 color;
            varying vec2 vUv;
            void main() {
                // Brillo tipo neón
                float alpha = 1.0 - smoothstep(0.4, 0.8, length(vUv - 0.5) * 2.0);
                gl_FragColor = vec4(color, alpha * 0.9);
            }
        `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const textMesh = new THREE.Mesh(textGeo, textMat);

            // Posicionar el texto sobre el planeta
            const worldPos = new THREE.Vector3();
            planetaMesh.getWorldPosition(worldPos);
            textMesh.position.copy(worldPos);
            textMesh.position.y += 5; // Un poco arriba

            // Orientar texto hacia la cámara inicialmente
            textMesh.lookAt(camera.position);
            textMesh.userData.centroLocal = new THREE.Vector3(centroX, 0, 0); // Para el shader

            grupoTextos.add(textMesh);

            // --- ANIMACIÓN DE ABSORCIÓN (TWEEN.JS) ---

            // 1. El texto aparece y se acerca un poco al agujero negro
            const posObjetivoIntermedia = new THREE.Vector3(
                worldPos.x * 0.3,
                worldPos.y * 0.1,
                worldPos.z * 0.3
            );

            const animacionAparecer = new TWEEN.Tween(textMesh.position)
                .to(posObjetivoIntermedia, 2500)
                .easing(TWEEN.Easing.Quadratic.Out);

            // 2. El texto entra en el horizonte de sucesos (se espaguetiza y acelera)
            const animacionAbsorber = new TWEEN.Tween(textMesh.position)
                .to({ x: 0, y: 0, z: 0 }, 1500)
                .easing(TWEEN.Easing.Exponential.In)
                .onUpdate((obj) => {
                    // Aumentar la "locura" del shader a medida que se acerca
                    const distanciaAlCentro = obj.distanceTo(new THREE.Vector3(0, 0, 0));
                    textMat.uniforms.time.value = (500 / (distanciaAlCentro + 1.0));

                    // Rotación caótica mientras es absorbido
                    textMesh.rotation.x += 0.05;
                    textMesh.rotation.y += 0.05;
                });

            // 3. Desvanecer y eliminar
            const animacionDesvanecer = new TWEEN.Tween(textMat.uniforms.color.value)
                .to({ r: 1, g: 0, b: 0 }, 500) // Ponerse rojo antes de morir
                .onComplete(() => {
                    grupoTextos.remove(textMesh);
                    textGeo.dispose();
                    textMat.dispose();
                });

            // Encadenar animaciones
            animacionAparecer.chain(animacionAbsorber);
            animacionAbsorber.chain(animacionDesvanecer);

            // Iniciar
            animacionAparecer.start();
        }

        /* =========================================================
           INTERACCIÓN (Raycaster)
        ========================================================= */
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener("click", (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const planetMeshes = meshesPlanetas.map(p => p.children[0]);
            const intersects = raycaster.intersectObjects(planetMeshes);

            if (intersects.length > 0) {
                const planetaMeshClicked = intersects[0].object;
                // Llamar a la función que crea el texto y lo anima
                crearYAbsorberTexto(planetaMeshClicked);
            }
        });

        /* =========================================================
           ANIMACIÓN
        ========================================================= */
        const reloj = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = reloj.getDelta();

            // Actualizar Tween.js
            TWEEN.update();

            // Rotación del sistema galáctico
            galaxia.rotation.y += delta * 0.05;

            // Órbita de planetas
            meshesPlanetas.forEach(p => {
                p.userData.angulo += p.userData.velocidad * delta * 5;
                const x = Math.cos(p.userData.angulo) * p.userData.distancia;
                const z = Math.sin(p.userData.angulo) * p.userData.distancia;
                p.position.set(x, 0, z);
                p.rotation.y += delta * 0.2; // Rotación propia del planeta
            });

            // Animación del núcleo
            accretionRing.material.uniforms.time.value += delta * 0.5;
            accretionRing.rotation.z += delta * 0.1;
            outerGlow.rotation.z -= delta * 0.05;

            // Hacer que los textos siempre miren a la cámara
            grupoTextos.children.forEach(t => {
                t.lookAt(camera.position);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        /* =========================================================
           REDIMENSIONAR
        ========================================================= */
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.TinnerHeight);
        });
    </script>

</body>

</html>
